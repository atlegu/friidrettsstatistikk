# Nattlig oppdatering av resultatbasen.
#
# Henter nye stevner fra kilden, avstemmer de siste seks ukene mot kilden
# (rettelser kommer inn, ingenting slettes), oppdaterer forsidetallene og
# kjører kontrollene i test_fullstendighet.py mot basen. Feiler en kontroll,
# feiler jobben, og det vises i Actions-fanen.
#
# Kjøres 03:37 norsk tid (01:37 UTC sommer). GitHub starter planlagte jobber
# med forsinkelse når køen er lang, gjerne timer på hele klokkeslett, så et
# skjevt minutt. Kan også startes
# for hånd under «Run workflow».
name: Oppdater resultater

on:
  schedule:
    - cron: "37 1 * * *"
  workflow_dispatch:
    inputs:
      avstem_uker:
        description: "Uker tilbake som hentes på nytt og avstemmes"
        default: "6"

concurrency:
  group: oppdater-resultater
  cancel-in-progress: false

jobs:
  oppdater:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: scraper
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Installer avhengigheter
        run: pip install -r requirements.txt httpx

      - name: Hent og avstem resultater
        run: python update_results.py --avstem-uker "${{ github.event.inputs.avstem_uker || '6' }}"

      # Terminlisten fra friidrett.no koblet mot resultatene, til
      # oppfølgingssiden i administrasjonsverktøyet. Feiler den (f.eks. fordi
      # friidrett.no endrer siden), skal ikke resten av jobben stoppe.
      - name: Koble terminlisten
        continue-on-error: true
        run: python hent_terminliste.py

      # Ikke godkjente resultater (kort bane, ikke medlem av NFIF, feil
      # startutstyr ...) står bare på utøversidene i kilden, ikke på
      # stevnesidene importen leser. Hver natt kontrolleres de 1 500 sist
      # aktive utøverne som ikke er sjekket de siste fire ukene (~40 min).
      - name: Ikke godkjente resultater fra utøversidene
        continue-on-error: true
        timeout-minutes: 50
        run: python hent_ikke_godkjente.py --eldre-enn '28 days' --antall 1500 --apply

      - name: Kontroller basen
        run: python test_fullstendighet.py --bare vindflagg dubletter avdrift tider stevnedubletter importdubletter

      - name: Ta vare på loggen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logg-${{ github.run_id }}
          path: scraper/logs/
          if-no-files-found: ignore
          retention-days: 30
